<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Administração | Rodízio de Mirantes</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/logo-rodizio.jpg" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="config.js"></script>
    <script defer src="admin.js"></script>
    <style>
      .admin-wrap {
        max-width: 1100px;
        margin: 45px auto;
        padding: 0 20px;
      }
      .admin-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
      }
      .admin-box {
        background: var(--cream);
        padding: 24px;
        margin: 22px 0;
      }
      .admin-form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .admin-form label {
        display: grid;
        gap: 6px;
        font-size: 13px;
      }
      .admin-form input,
      .admin-form textarea,
      .admin-form select {
        padding: 11px;
        border: 1px solid #ddd;
        font: 14px "DM Sans";
      }
      .admin-form .wide {
        grid-column: 1/-1;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      .admin-table th,
      .admin-table td {
        text-align: left;
        padding: 11px;
        border-bottom: 1px solid #eee;
        font-size: 13px;
      }
      .admin-table img {
        width: 55px;
        height: 45px;
        object-fit: cover;
      }
      .danger {
        background: #8d1c28;
        color: white;
        border: 0;
        padding: 8px 12px;
        cursor: pointer;
      }
      .small-btn {
        padding: 8px 12px;
        border: 1px solid #bbb;
        background: white;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      .admin-note {
        font-size: 13px;
        color: var(--muted);
      }
      @media (max-width: 650px) {
        .admin-form {
          grid-template-columns: 1fr;
        }
        .admin-table {
          display: block;
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html"
        ><img src="assets/logo-rodizio.jpg" alt="" /><span
          >RODÍZIO <b>DE MIRANTES</b><small>ADMINISTRAÇÃO</small></span
        ></a
      ><a href="index.html">Ver site público ↗</a>
    </header>
    <main class="admin-wrap">
      <div class="admin-head">
        <div>
          <p class="eyebrow">ÁREA RESTRITA</p>
          <h2>Painel de gerenciamento</h2>
        </div>
        <button id="logout" class="btn btn-outline-dark hidden">
          Terminar sessão
        </button>
      </div>
      <section id="login-box" class="admin-box">
        <h3>Acesso do administrador</h3>
        <form id="login-form" class="admin-form">
          <label>Email<input name="email" type="email" required /></label
          ><label
            >Palavra-passe<input
              name="password"
              type="password"
              required /></label
          ><button class="btn btn-gold wide">Entrar</button>
        </form>
        <p id="login-status" class="admin-note"></p>
      </section>
      <section id="dashboard" class="hidden">
        <div class="admin-box">
          <h3 id="form-title">Adicionar prato</h3>
          <form id="product-form" class="admin-form">
            <input type="hidden" name="id" /><label
              >Nome do prato<input
                name="name"
                required
                maxlength="100" /></label
            ><label
              >Preço (Kz)<input
                name="price_kz"
                type="number"
                min="0"
                step="1"
                required /></label
            ><label
              >Categoria<select
                name="category_id"
                id="category-select"
                required
              ></select></label
            ><label
              >Fotografia<input
                name="photo"
                type="file"
                accept="image/*" /></label
            ><label class="wide"
              >Descrição<textarea
                name="description"
                rows="3"
                maxlength="500"
              ></textarea></label
            ><label
              ><span>Disponível no menu</span
              ><input name="is_active" type="checkbox" checked /></label
            ><button class="btn btn-gold wide" type="submit">
              Guardar prato
            </button>
            <p id="product-status" class="admin-note wide"></p>
          </form>
        </div>
        <div class="admin-box">
          <h3>Pratos publicados</h3>
          <div id="product-list">A carregar...</div>
        </div>
        <div class="admin-box">
          <h3>Pedidos de reserva</h3>
          <div id="reservation-list">A carregar...</div>
        </div>
      </section>
    </main>
  </body>
</html>
